global
    log stdout format raw local0
    maxconn 2048
    stats socket ipv4@0.0.0.0:9999 level admin
defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    option tcplog
listen ssh
    bind :5223
    server bastion bastion:5222 send-proxy
listen synthetic_clients
    bind :5222 accept-proxy
    server bastion bastion:5222 send-proxy
listen direct
    bind :2222
    server blue blue:2222
listen tunnel
    bind :4002
    server blue blue:4002
    server green green:4002 disabled
listen api
    bind :4001
    server blue blue:4001
    server green green:4001 disabled
