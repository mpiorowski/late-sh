# Local stand-in for the prod SSH edge (infra/ssh-tcp.tf) plus the
# service-ssh Service it forwards to. The pods are the containers
# scripts/fleet.sh starts under the `ssh-pod` network alias; Docker's DNS
# lists every running one, draining pods included, and the health check takes
# a pod out of rotation the moment `/api/health` stops answering 200, which a
# draining pod does from its first instant. That is the Service dropping a
# terminating pod's endpoint: open connections stay where they are, new ones
# go to a ready pod. Ports come from .env, so instance 2 works the same.
# No PROXY protocol: the dev profile does not read it, and local clients
# already share one source IP through Docker.

global
  log stdout format raw local0
  # Local only, prod's edge has none: scripts/fleet.sh reads `show stat`
  # here to drain an old pod only once the edge routes to the new one.
  # Operator level is what lists the server addresses it matches pods by.
  stats socket ipv4@127.0.0.1:9999 level operator

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 12h
  timeout server 12h
  # A pod that closed its listeners at drain refuses the connect before the
  # next health check marks it down; retry that dial on another pod.
  retries 3
  option redispatch 1
  option httpchk
  http-check send meth GET uri /api/health ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  default-server check port "${LATE_API_PORT}" inter 1s fall 1 rise 1 resolvers docker init-addr none

resolvers docker
  nameserver dns 127.0.0.11:53

frontend ssh
  bind "*:${LATE_SSH_PORT}"
  default_backend ssh_pods

frontend api
  bind "*:${LATE_API_PORT}"
  default_backend api_pods

frontend irc
  bind "*:${LATE_IRC_PORT}"
  default_backend irc_pods

# A draining pod keeps its address in Docker's DNS, and so a slot here, until
# its last session ends, which in dev can be never (make fleet-expire). A pod
# the edge has no slot for is never routed to; fleet.sh refuses to drain
# for it, and 64 slots make that wait a long way off.
backend ssh_pods
  server-template pod 64 "ssh-pod:${LATE_SSH_PORT}"

backend api_pods
  server-template pod 64 "ssh-pod:${LATE_API_PORT}"

backend irc_pods
  server-template pod 64 "ssh-pod:${LATE_IRC_PORT}"
