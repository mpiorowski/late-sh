# Its own project: without this, compose resolves this file and
# docker-compose.yml to one project, and `make barebones-down` would remove the
# full stack's database.
name: ${INSTANCE:-late}-barebones

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    container_name: ${INSTANCE:-late}-barebones-postgres

  late-ssh:
    container_name: ${INSTANCE:-late}-barebones-ssh
    build:
      context: .
      dockerfile: docker/barebones.Dockerfile
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      RUST_MIN_STACK: "8388608"
      CARGO_INCREMENTAL: "1"
    ports:
      - "${LATE_SSH_PORT:-2222}:${LATE_SSH_PORT:-2222}"
      - "${LATE_API_PORT:-4001}:${LATE_API_PORT:-4001}"
      - "${LATE_IRC_PORT:-6667}:${LATE_IRC_PORT:-6667}"
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target-barebones:/app/target
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'exec 3<>/dev/tcp/localhost/${LATE_API_PORT:-4001}; printf \"GET /api/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
      start_interval: 5s

volumes:
  postgres-data:
  cargo-registry:
  cargo-git:
  cargo-target-barebones:
