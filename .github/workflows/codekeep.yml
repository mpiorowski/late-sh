name: codekeep

# Dedicated CI/CD for the CodeKeep door, responsible only for the locked
# package/runtime image (docker/doors/codekeep.Dockerfile):
#   - build_validate: install the exact package graph from bun.lock and prove
#     CodeKeep reports the pinned version. Runs on relevant changes and weekly.
#   - push_image: on push to main, publish the image the root Dockerfile pins
#     as its codekeep-build stage (ghcr door-codekeep, tag from DOOR_IMAGE_TAG).
#   - verify_deployed: manual, per-environment. Confirms the live late-codekeep
#     deployment is rolled out and the door is enabled on service-ssh.
#
# The late-codekeep host image (runtime-codekeep) builds from the root
# Dockerfile in deploy_codekeep.yml; it is not built here.

on:
  pull_request:
    paths:
      - docker/doors/codekeep.Dockerfile
      - docker/codekeep/package.json
      - docker/codekeep/bun.lock
      - docker/codekeep/codekeep
      - .github/workflows/codekeep.yml
  push:
    branches: [main]
    paths:
      - docker/doors/codekeep.Dockerfile
      - docker/codekeep/package.json
      - docker/codekeep/bun.lock
      - docker/codekeep/codekeep
      - .github/workflows/codekeep.yml
  schedule:
    - cron: "0 6 * * 6" # Saturdays 06:00 UTC (staggered a day after brogue's)
  workflow_dispatch:
    inputs:
      run_verify_deployed:
        description: "Also verify the door is enabled on the live pod after building"
        required: false
        default: false
        type: boolean
      environment:
        description: "Target environment for verify_deployed"
        required: false
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# The published door image tag. Must match the pin in the root Dockerfile's
# codekeep-build stage; bump both together on any recipe or package change.
env:
  DOOR_IMAGE_TAG: 1.0.9-r1

jobs:
  build_validate:
    name: build_validate_codekeep_stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup_docker_buildx
        uses: docker/setup-buildx-action@v4

      # The stage itself installs from the frozen lock and asserts the exact
      # version; run the shipped wrapper as a smoke test too.
      - name: build_codekeep_stage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/doors/codekeep.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: codekeep-build:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke_test_game
        run: |
          docker run --rm codekeep-build:ci /usr/local/bin/codekeep --version | grep -qx '1.0.9'

  push_image:
    name: push_door_codekeep_image
    needs: build_validate
    # workflow_dispatch is the bootstrap/re-push lever: publish this image
    # before the root Dockerfile pin is built for the first time. Scheduled
    # checks never mutate a pinned tag.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup_docker_buildx
        uses: docker/setup-buildx-action@v4

      - name: login_to_ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push_door_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/doors/codekeep.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/door-codekeep:${{ env.DOOR_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify_deployed:
    name: verify_deployed
    needs: build_validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_verify_deployed }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - name: setup_kubectl
        uses: azure/setup-kubectl@v5

      - name: set_kubernetes_context
        uses: azure/k8s-set-context@v5
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: wait_for_rollout
        run: kubectl rollout status deployment/late-codekeep -n default --timeout=180s

      - name: verify_door_enabled
        run: |
          # LATE_CODEKEEP_ENABLED is a client flag on service-ssh, not on the
          # late-codekeep host pod.
          POD=$(kubectl get pod -l app=service-ssh -n default -o jsonpath='{.items[0].metadata.name}')
          echo "service-ssh pod: ${POD}"
          enabled=$(kubectl exec "${POD}" -- printenv LATE_CODEKEEP_ENABLED || true)
          echo "LATE_CODEKEEP_ENABLED=${enabled}"
          case "$(echo "${enabled}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) echo "door enabled" ;;
            *) echo "::warning::CodeKeep door is not enabled (LATE_CODEKEEP_ENABLED=${enabled})" ;;
          esac
