name: deploy_infra

# Full terraform apply of the cluster manifests. This is how manifest changes
# (env, resources, PVCs, new services, Grafana dashboards) ship; component
# images are untouched here because every deployment ignores image changes
# (lifecycle blocks in infra), so no current-tag scraping is needed.
#
# The music sync used to run here as a second job. It lives in sync_music.yml
# now and is manual only: it wipes and re-copies the liquidsoap library, which
# has nothing to do with applying manifests.
#
# Called by release.yml for -infra releases, and for the -full releases that
# ship an ssh image and this apply together; workflow_dispatch is the manual
# lever.

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to deploy"
        required: true
        type: string
      environment:
        description: "Deployment environment"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy, for example v0.27.11-infra"
        required: true
        type: string
      environment:
        description: "Deployment environment"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

jobs:
  terraform:
    name: terraform_apply
    uses: ./.github/workflows/terraform.yml
    permissions:
      contents: read
    secrets: inherit
    concurrency:
      group: deploy-infra-${{ inputs.environment }}
      cancel-in-progress: false
    with:
      environment: ${{ inputs.environment }}
      source_ref: ${{ inputs.release_tag }}
