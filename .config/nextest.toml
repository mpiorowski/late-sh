[profile.default]
# kill any test still running after 5 minutes (SLOW warnings start at 60s)
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
late-ssh-db = { max-threads = 8 }

[[profile.default.overrides]]
filter = 'package(late-ssh)'
test-group = 'late-ssh-db'

# The arena's report tests fight every crown against every calling on both
# archetype paths (thousands of real engine fights); give them room.
[[profile.default.overrides]]
filter = 'test(arena_report)'
slow-timeout = { period = "60s", terminate-after = 15 }
