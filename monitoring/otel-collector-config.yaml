extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    # About 80% of the 512Mi container limit (infra/monitoring.tf), leaving the
    # rest for the Go runtime. Keep in step with that limit and GOMEMLIMIT.
    limit_mib: 400
    spike_limit_mib: 100
  batch:

connectors:
  spanmetrics:
    # Span names carry the raw path for unmatched routes, so scanner traffic
    # mints new series without bound. Expire series idle this long so memory
    # tracks recent traffic instead of growing until the pod is OOMKilled.
    metrics_expiration: 15m
    # Keep only the dimensions the dashboard needs; everything else stays on current defaults.
    dimensions:
      - name: http.request.method
      - name: http.route
      - name: http.response.status_code
      - name: rpc.system
      - name: rpc.service
      - name: rpc.method
    exemplars:
      enabled: true
    resource_metrics_key_attributes:
      - service.name
      - telemetry.sdk.language
      - telemetry.sdk.name
  servicegraph:
    dimensions:
      - rpc.system
      - rpc.service
      - rpc.method

exporters:
  otlp_grpc/victoriatraces:
    endpoint: ${env:TRACES_ENDPOINT}
    tls:
      insecure: true

  otlp_http/victorialogs:
    logs_endpoint: ${env:LOGS_ENDPOINT}

  prometheusremotewrite/victoriametrics:
    endpoint: ${env:METRICS_ENDPOINT}
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/victoriatraces, spanmetrics, servicegraph]
    metrics:
      receivers: [otlp, spanmetrics, servicegraph]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite/victoriametrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/victorialogs]
